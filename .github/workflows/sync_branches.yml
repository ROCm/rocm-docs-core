name: "Sync to develop"

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:

jobs:
  sync_branches:
    runs-on: ubuntu-latest
    concurrency: sync_branches
    name: Sync the branch with the default branch (develop)
    steps:
    # GITHUB_TOKEN cannot bypass the branch_protection ruleset on develop.
    - name: Generate token (GitHub app)
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        permission-contents: write
        permission-metadata: read
    - name: Push develop forward (ff only)
      shell: sh
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REPOSITORY: ${{ github.repository }}
        TARGET_SHA: ${{ inputs.sha || github.sha }}
      run: |
        REF="refs/heads/${DEFAULT_BRANCH}"
        gh api "/repos/${REPOSITORY}/git/$REF"              \
          --method PATCH                                    \
          --header "Accept: application/vnd.github+json"    \
          --header "X-GitHub-Api-Version: 2022-11-28"       \
          --raw-field sha="${TARGET_SHA}"                   \
          --field force=false
