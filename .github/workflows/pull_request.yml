name: Code
on:
  pull_request:

jobs:
  lint:
    name: Python Linting
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.10"]

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "${{ matrix.python-version }}"
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements.txt
    - name: Cache venv
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
      with:
        path: .venv
        key: venv-${{ matrix.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml','requirements.txt') }}
    - run: echo "PRE_COMMIT_HOME=$Env:GITHUB_WORKSPACE/.cache/pre-commit" >> "$Env:GITHUB_ENV"
      if: ${{ startsWith(matrix.os, 'windows') }}
    - run: echo "PRE_COMMIT_HOME=$GITHUB_WORKSPACE/.cache/pre-commit" >> "$GITHUB_ENV"
      if: ${{ !startsWith(matrix.os, 'windows') }}
    - name: Cache pre-commit
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
      with:
        path: ${{ env.PRE_COMMIT_HOME }}
        key: pre-commit-${{ matrix.os }}-${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: '1.13.0'
    - name: Create virtual env, install requirements
      run: just deps
    - name: Check commit messages
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: just _check-commit-range "refs/remotes/origin/${BASE_REF}..HEAD"
    - name: Check linting, formatting, types
      run: just --set verbose_errors true -- check-codestyle

  test:
    name: Python Tests
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.10"]

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "${{ matrix.python-version }}"
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements.txt
    - name: Set up Doxygen
      uses: ssciwr/doxygen-install@fa3e94d34131d3990b6b8ba939ab982964aa3758 # v2.0.3
      with:
        version: 1.9.8
    - name: Set up Graphviz
      uses: ts-graphviz/setup-graphviz@b1de5da23ed0a6d14e0aeee8ed52fdd87af2363c # v2.0.2
      with:
        # unpinned on Ubuntu: apt package versions are tied to the
        # runner image, so a pin breaks whenever ubuntu-latest moves to a new release.
        windows-graphviz-version: '9.0.0'
    - name: Cache venv
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
      with:
        path: .venv
        key: venv-${{ matrix.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml','requirements.txt') }}
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: '1.13.0'
    - name: Create virtual env, install requirements
      run: just deps
    - name: Install
      run: just install
    - name: Run tests
      run: just test
