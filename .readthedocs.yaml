# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

sphinx:
   configuration: docs/conf.py

formats: [htmlzip, pdf, epub]

python:
   install:
   - method: pip
     path: .
     extra_requirements:
       - "api_reference"
   - requirements: requirements.txt

build:
   os: ubuntu-22.04
   tools:
      python: "3.10"
   apt_packages:
     - "doxygen"
     - "graphviz" # For dot graphs in doxygen
   jobs:
     # Clone the shared build-data repo (version files, projects.yaml, etc.)
     # so rocm_docs reads them locally instead of fetching from GitHub.
     # Cloning the tip of main tracks the latest common data on every build;
     # docs/conf.py points rocm_docs_common_dir at this checkout.
     post_checkout:
       - git clone --depth 1 --branch main https://github.com/neon60/rocm-docs-common.git rocm-docs-common
